name: Firmware
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./fw image
      - run: ./fw test
      - run: ./fw build
      - run: python3 tools/check-artifacts.py
      - name: Verify source isolation
        run: git diff --check && git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-build
          path: |
            dist/firmware/
            dist/build-manifest.json
            dist/firmware.elf
            dist/firmware.map
            dist/size.txt
            dist/size.json
            dist/SHA256SUMS
            dist/build.log
          if-no-files-found: error
