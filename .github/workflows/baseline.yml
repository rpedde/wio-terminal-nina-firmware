name: NINA firmware
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./fw image
      - run: ./fw test
      - run: ./fw build
      - run: python3 tools/check-artifacts.py
      - run: git diff --check && git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
